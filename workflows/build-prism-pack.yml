name: Build Prism modpack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'input/**'
      - 'scripts/**'
      - '.github/workflows/build-prism-pack.yml'

permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests

      - name: Resolve mods and build .mrpack
        run: python scripts/build_mrpack.py
        env:
          MODRINTH_USER_AGENT: 10ohn-D03/minecraft-modpack-builder/1.0 (modpack build)

      - name: Upload Prism pack and reports
        uses: actions/upload-artifact@v4
        with:
          name: prism-modpack-1.21.1-neoforge
          path: dist/
          if-no-files-found: error
          retention-days: 14
